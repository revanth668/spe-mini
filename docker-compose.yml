services:
  calculator:
    image: revanth668hehe/calculator:latest
    environment:
      - PORT=8080
    expose:
      - "8080"
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
